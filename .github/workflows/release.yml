name: Release

on:
  push:
    branches: [main]
    paths: [VERSION]
  pull_request:
    paths:
      - VERSION
      - tools/bundle.py
      - tools/release.py
      - tests/check-bundle.py
      - tests/check-release.py
      - .github/workflows/release.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    outputs:
      tag: ${{ steps.release.outputs.tag }}
      asset: ${{ steps.release.outputs.asset }}
      prerelease: ${{ steps.release.outputs.prerelease }}
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Check the bundle and release tools
        run: |
          python3 tests/check-bundle.py --build-only
          python3 tests/check-release.py
      - name: Build the bundle and commit-list notes
        id: release
        run: python3 tools/release.py prepare >> "$GITHUB_OUTPUT"
      - name: Set up Ollama
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        id: ollama
        continue-on-error: true
        timeout-minutes: 5
        uses: ai-action/setup-ollama@3f4edee0ac3517f3d75511f92159861ebb500db7 # v2
      - name: Write short release notes with Llama
        if: steps.ollama.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 6
        run: python3 tools/release.py summarize
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: release
          path: |
            dist/${{ steps.release.outputs.asset }}
            dist/release-notes.md
          if-no-files-found: error

  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: release
          path: dist
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ needs.prepare.outputs.tag }}
          ASSET: ${{ needs.prepare.outputs.asset }}
          PRERELEASE: ${{ needs.prepare.outputs.prerelease }}
        run: |
          existing_tag=$(gh api "repos/$GH_REPO/git/matching-refs/tags/$TAG" \
            --jq ".[] | select(.ref == \"refs/tags/$TAG\") | .object.sha")
          if [[ -n "$existing_tag" ]]; then
            commit=$(gh api "repos/$GH_REPO/commits/$TAG" --jq .sha)
            if [[ "$commit" != "$GITHUB_SHA" ]]; then
              echo "Tag $TAG already points to another commit. Bump VERSION."
              exit 1
            fi
          fi
          if gh release view "$TAG" --json isDraft --jq '.isDraft' > "$RUNNER_TEMP/is-draft"; then
            if [[ $(cat "$RUNNER_TEMP/is-draft") == false ]]; then
              echo "Release $TAG already exists."
              exit 0
            fi
            echo "A draft for $TAG already exists. Finish or delete it before retrying."
            exit 1
          fi
          options=()
          if [[ "$PRERELEASE" == true ]]; then
            options+=(--prerelease)
          fi
          gh release create "$TAG" "dist/$ASSET" \
            --target "$GITHUB_SHA" --title "Csound MAL $TAG" \
            --notes-file dist/release-notes.md "${options[@]}"
